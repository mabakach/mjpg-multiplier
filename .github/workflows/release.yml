name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build image tar and push image to GHCR
        run: >
          ./mvnw -B clean verify jib:buildTar jib:build
          -Dmaven.test.skip=true
          -Djib.to.image=ghcr.io/${GITHUB_REPOSITORY,,}
          -Djib.to.auth.username=${{ github.actor }}
          -Djib.to.auth.password=${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release with image tar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" target/*.tar
          --title "$GITHUB_REF_NAME" --generate-notes
